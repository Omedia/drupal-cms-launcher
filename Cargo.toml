[package]
name = "drupal-cms-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A self-contained local Drupal CMS launcher for macOS"
license = "GPL-2.0-or-later"
repository = "https://github.com/Omedia/drupal-cms-launcher"
readme = "README.md"

[dependencies]
anyhow = "1"
gpui-kit = "=0.6.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.release]
strip = true
