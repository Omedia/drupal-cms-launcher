name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    # macOS 26 is required: the site image is created with `diskutil image create --format ASIF`.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Install build tools
        run: brew install php composer autoconf pcre2

      - name: Install the Metal toolchain for GPUI shaders
        run: |
          xcodebuild -downloadComponent MetalToolchain \
            || echo "::warning::Metal toolchain download failed; it may already be installed."

      - name: Bundle PHP and build APCu
        run: python3 scripts/prepare.py

      - name: Build the Drupal CMS site image
        run: python3 scripts/build_site.py

      - name: Build the launcher
        run: cargo build --release

      - name: Lint
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        run: cargo test --release --lib

      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "${MACOS_CERTIFICATE:-}" ]]; then
            echo "No signing certificate provided; the app will be ad-hoc signed."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERTIFICATE" | base64 -D > "$CERT_PATH"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          rm -f "$CERT_PATH"

      - name: Package the app and disk image
        env:
          DRUPAL_CMS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY || '-' }}
          DRUPAL_CMS_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python3 scripts/package.py

      - name: Notarize the disk image
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -z "${APPLE_API_ISSUER_ID:-}" || -z "${APPLE_API_KEY:-}" || -z "${SIGNING_IDENTITY:-}" ]]; then
            echo "::warning::Notarization skipped: signing or App Store Connect secrets are not set."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf "%s" "$APPLE_API_KEY" > "$KEY_PATH"
          xcrun notarytool submit dist/Drupal-CMS-Launcher-macOS-arm64.dmg --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple dist/Drupal-CMS-Launcher-macOS-arm64.dmg
          rm -f "$KEY_PATH"

      - name: Smoke-test the packaged app
        run: |
          python3 tests/smoke.py \
            'dist/Drupal CMS Launcher.app/Contents/MacOS/drupal-cms-launcher' \
            'dist/Drupal CMS Launcher.app/Contents/Resources'

      - name: Checksum
        run: shasum -a 256 dist/Drupal-CMS-Launcher-macOS-arm64.dmg | awk '{print $1}' > dist/Drupal-CMS-Launcher-macOS-arm64.dmg.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Drupal-CMS-Launcher-macOS-arm64
          path: |
            dist/Drupal-CMS-Launcher-macOS-arm64.dmg
            dist/Drupal-CMS-Launcher-macOS-arm64.dmg.sha256
          if-no-files-found: error

  release:
    # A tag publishes a versioned release; main keeps a rolling "latest" build.
    needs: app
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Drupal-CMS-Launcher-macOS-arm64
          path: dist

      - name: Replace the previous rolling build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest build from main' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
          fail_on_unmatched_files: true
          files: |
            dist/Drupal-CMS-Launcher-macOS-arm64.dmg
            dist/Drupal-CMS-Launcher-macOS-arm64.dmg.sha256
